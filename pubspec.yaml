name: ems_app
description: "EventSphere — A production-grade Event Management System."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ── State Management ──────────────────────────────────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  flutter_hooks: ^0.20.5
  hooks_riverpod: ^2.6.1

  # ── Navigation ────────────────────────────────────────────────────────────
  go_router: ^14.6.2

  # ── Network ───────────────────────────────────────────────────────────────
  dio: ^5.11.0
  pretty_dio_logger: ^1.4.0

  # ── Storage ───────────────────────────────────────────────────────────────
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.5.3

  # ── Code Generation ───────────────────────────────────────────────────────
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # ── UI & UX ───────────────────────────────────────────────────────────────
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  google_fonts: ^6.3.2
  flutter_svg: ^2.2.2

  # ── Utilities ─────────────────────────────────────────────────────────────
  connectivity_plus: ^6.1.1
  permission_handler: ^11.3.1
  intl: ^0.20.2
  uuid: ^4.6.0
  qr_flutter: ^4.1.0
  table_calendar: ^3.2.1
  image_picker: ^1.2.1
  razorpay_flutter: ^1.3.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ── Code Generation ───────────────────────────────────────────────────────
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.3
  freezed: ^2.5.7
  json_serializable: ^6.9.0

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
